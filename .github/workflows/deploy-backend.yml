name: Deploy Backend to Portainer CE

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test Backend & Redeploy Stack on Portainer CE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run Backend Tests (Unit, ArchUnit & Integration)
        working-directory: backend
        run: mvn test --batch-mode

      - name: Trigger Git Stack Redeploy on Portainer CE via REST API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_GIT_USERNAME: ${{ secrets.PORTAINER_GIT_USERNAME }}
          PORTAINER_GIT_PASSWORD: ${{ secrets.PORTAINER_GIT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${PORTAINER_URL:-}" ] || [ -z "${PORTAINER_API_KEY:-}" ] || [ -z "${PORTAINER_STACK_ID:-}" ] || [ -z "${PORTAINER_ENDPOINT_ID:-}" ]; then
            echo "::error::Missing required Portainer secrets (PORTAINER_URL, PORTAINER_API_KEY, PORTAINER_STACK_ID, PORTAINER_ENDPOINT_ID)."
            exit 1
          fi

          BASE_URL="${PORTAINER_URL%/}"

          echo "Fetching current stack configuration from Portainer CE (stack ID: ${PORTAINER_STACK_ID})..."
          STACK_JSON=$(curl -fsSL \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${BASE_URL}/api/stacks/${PORTAINER_STACK_ID}")

          PAYLOAD=$(echo "${STACK_JSON}" | jq -n \
            --argjson stack "${STACK_JSON}" \
            --arg gitUser "${PORTAINER_GIT_USERNAME:-}" \
            --arg gitPass "${PORTAINER_GIT_PASSWORD:-}" \
            '{
              env: ($stack.Env // []),
              prune: true,
              pullImage: true,
              repositoryReferenceName: "refs/heads/main",
              repositoryAuthentication: ($gitUser != "" and $gitPass != ""),
              repositoryUsername: $gitUser,
              repositoryPassword: $gitPass
            }')

          echo "Triggering Git stack redeploy on Portainer CE (endpointId: ${PORTAINER_ENDPOINT_ID})..."
          curl -fsSL -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${BASE_URL}/api/stacks/${PORTAINER_STACK_ID}/git/redeploy?endpointId=${PORTAINER_ENDPOINT_ID}" > /dev/null

          echo "Portainer CE stack redeploy completed successfully."
