server:
  forward-headers-strategy: native

spring:
  application:
    name: secret-santa-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/secret_santa}
      auto-index-creation: true

secretsanta:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    token-secret: ${SECRETSANTA_TOKEN_SECRET:default-dev-secret-key-with-at-least-32-bytes-length-2026}
    access-token-ttl-minutes: 15
    refresh-token-ttl-minutes: 60
    cookie:
      secure: ${SECRETSANTA_COOKIE_SECURE:}
      same-site: ${SECRETSANTA_COOKIE_SAME_SITE:Lax}
      domain: ${SECRETSANTA_COOKIE_DOMAIN:}
